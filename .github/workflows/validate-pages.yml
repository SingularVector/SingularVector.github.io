name: Build and publish GitHub Pages

on:
  pull_request:
  push:
    branches: [master, upgrade/minimal-mistakes-4.28.1, design/homepage-preview, navigation/topic-hub, content/seo-positioning, content/technical-freshness, content/string-encryption-article, migration/singularvector]
  workflow_dispatch:
  schedule:
    # Before the Swiss morning: 04:17 CET / 05:17 CEST.
    - cron: '17 3 * * *'

# Keep production deployments in order; PR validation has its own ref/group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build using GitHub Pages tooling
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: false
      - name: Check theme and monetization integration
        shell: bash
        run: |
          test -s _site/index.html
          grep -q 'Minimal Mistakes Jekyll Theme 4.28.1' _site/index.html
          grep -q 'ca-pub-8799681346916578' _site/index.html
          cmp ads.txt _site/ads.txt
          test -s _site/feed.xml
          test -s _site/sitemap.xml
          for route in articles topics search topics/powershell topics/linux topics/identity topics/infrastructure topics/python topics/git; do
            test -s "_site/$route/index.html"
          done
          test "$(grep -o 'id="search"' _site/search/index.html | wc -l)" -eq 1
          test "$(grep -o 'id="results"' _site/search/index.html | wc -l)" -eq 1
      - name: Check SEO metadata and archive links
        run: python3 scripts/check-content-seo.py
      - name: Check rendered asset references
        run: python3 scripts/check-article-assets.py
      - name: Check internal links and sitemap targets
        run: python3 scripts/check-site-discovery.py
      - name: Retain generated site for inspection
        uses: actions/upload-artifact@v7
        with:
          name: validated-jekyll-site
          path: _site/
          retention-days: 7
      - name: Package validated site for Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v5
