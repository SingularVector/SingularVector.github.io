{% if jekyll.environment == 'production' and site.comments.giscus.repo_id != blank and site.comments.giscus.category_id != blank %}
<script src="https://giscus.app/client.js"
        data-repo="{{ site.repository | escape }}"
        data-repo-id="{{ site.comments.giscus.repo_id | escape }}"
        data-category="{{ site.comments.giscus.category_name | escape }}"
        data-category-id="{{ site.comments.giscus.category_id | escape }}"
        data-mapping="{{ site.comments.giscus.discussion_term | default: 'pathname' | escape }}"
        data-strict="{{ site.comments.giscus.strict | default: 1 }}"
        data-reactions-enabled="{{ site.comments.giscus.reactions_enabled | default: 1 }}"
        data-emit-metadata="{{ site.comments.giscus.emit_metadata | default: 0 }}"
        data-input-position="{{ site.comments.giscus.input_position | default: 'top' | escape }}"
        data-theme="{{ site.comments.giscus.theme | default: 'dark' | escape }}"
        data-lang="{{ site.comments.giscus.lang | default: 'en' | escape }}"
        {% if site.comments.giscus.lazy %}data-loading="lazy"{% endif %}
        crossorigin="anonymous"
        async>
</script>
{% endif %}
