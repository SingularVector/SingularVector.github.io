<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">How branches diverge and merge</title><desc id="desc">History flows left to right. Main and feature diverge at B. Merge commit M joins C and E.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">How branches diverge and merge</text><text x="45" y="100" class="small">Each circle is a commit. Branch names point to the latest commit on that branch.</text><path d="M130,220 L300,220" class="line"/><path d="M300,220 L530,220" class="line"/><path d="M300,220 L530,350" class="line"/><path d="M530,350 L760,350" class="line"/><path d="M530,220 L1000,220" class="line"/><path d="M760,350 L1000,220" class="line"/><circle cx="130" cy="220" r="28" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="121" y="228" class="label">A</text><circle cx="300" cy="220" r="28" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="291" y="228" class="label">B</text><circle cx="530" cy="220" r="28" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="521" y="228" class="label">C</text><circle cx="530" cy="350" r="28" fill="#d1fae5" stroke="#64748b" stroke-width="2"/><text x="521" y="358" class="label">D</text><circle cx="760" cy="350" r="28" fill="#d1fae5" stroke="#64748b" stroke-width="2"/><text x="751" y="358" class="label">E</text><circle cx="1000" cy="220" r="28" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="991" y="228" class="label">M</text><text x="460" y="165" class="label">main before merge</text><text x="650" y="415" class="label">feature/logging</text><text x="925" y="165" class="label">main after merge</text><text x="65" y="475" class="small">B: common ancestor    C: main advances    D–E: feature work    M: merge commit</text><text x="65" y="520" class="small">M has two parents: C and E. Both lines of history are retained.</text><text x="65" y="560" class="small">If main has no new commits after B, a default merge can fast-forward to E instead.</text></svg>