<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A practical local branching workflow</title><desc id="desc">Start on main, create feature/logging, commit changes, then switch to main and merge.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">A practical local branching workflow</text><rect x="45" y="100" width="530" height="175" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="67" y="137" class="label">1. Start on main</text><text x="67" y="185" class="code">git switch main</text><text x="67" y="225" class="code">git status</text><rect x="625" y="100" width="530" height="175" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="647" y="137" class="label">2. Create + switch</text><text x="647" y="185" class="code">git switch -c feature/logging</text><text x="647" y="225" class="small">Branch starts at current commit.</text><rect x="45" y="320" width="530" height="175" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="67" y="357" class="label">3. Save your work</text><text x="67" y="405" class="code">git add logging.txt</text><text x="67" y="445" class="code">git commit -m &quot;Add logging notes&quot;</text><rect x="625" y="320" width="530" height="175" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="647" y="357" class="label">4. Merge into main</text><text x="647" y="405" class="code">git switch main</text><text x="647" y="445" class="code">git merge feature/logging</text><path d="M575,185 L620,185" class="line"/><path d="M625,280 L575,315" class="line"/><path d="M575,405 L620,405" class="line"/><text x="45" y="570" class="small">Check, commit and test your work before merging. Delete the merged branch when finished.</text></svg>