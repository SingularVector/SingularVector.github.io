<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Resolve a text merge conflict</title><desc id="desc">Inspect HEAD and feature versions, edit the desired final content, test, stage and commit.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="620" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Resolve a text merge conflict</text><rect x="45" y="100" width="530" height="240" rx="12" fill="#fff1f2" stroke="#cbd5e1"/><text x="65" y="137" class="label">1. Inspect the conflict on main</text><text x="65" y="180" class="code">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><text x="65" y="213" class="code">level=warning</text><text x="65" y="246" class="code">=======</text><text x="65" y="279" class="code">level=debug</text><text x="65" y="312" class="code">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/logging</text><rect x="625" y="100" width="530" height="240" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="645" y="137" class="label">2. Edit to the intended result</text><text x="645" y="195" class="code">level=info</text><text x="645" y="250" class="small">Example: choose a reviewed value.</text><text x="645" y="285" class="small">Remove every conflict marker.</text><path d="M580,220 L620,220" class="line"/><rect x="45" y="385" width="1110" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="423" class="label">3. Review and test, then finish the merge</text><text x="65" y="466" class="code">git add logging.txt</text><text x="65" y="505" class="code">git commit -m &quot;Merge logging branch; resolve log level&quot;</text><path d="M890,345 L890,380" class="line"/><text x="45" y="575" class="small">Need to stop? With a clean working tree before merging, use git merge --abort.</text></svg>