<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Recover the commit before changing anything else</title><desc id="desc">Three steps: find a previous position in reflog, inspect its commit with git show, then create a rescue branch pointing at it.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Recover the commit before changing anything else</text><text x="45" y="100" class="small">A displaced commit may still exist. Find it, inspect it, then give it a name.</text><rect x="45" y="140" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="172" class="label">1. Find the previous position</text><text x="65" y="206" class="code">git reflog --date=local -10</text><text x="65" y="234" class="small">Look for the operation and the commit you want to recover.</text><rect x="45" y="275" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="307" class="label">2. Check the content</text><text x="65" y="341" class="code">git show c3d4e5f</text><text x="65" y="369" class="small">Use the actual hash from your own reflog.</text><rect x="45" y="410" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="442" class="label">3. Preserve the commit</text><text x="65" y="476" class="code">git branch rescue/logging c3d4e5f</text><text x="65" y="504" class="small">Creates a reference without switching branches or changing working files.</text><text x="45" y="570" class="small">Reflog is local and expires. It is not a backup of uncommitted editor changes.</text></svg>