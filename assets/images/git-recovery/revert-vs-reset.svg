<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Revert adds history; reset moves a branch</title><desc id="desc">Revert keeps A B C and adds R. Reset moves main back to B while C is no longer reachable through main.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Revert adds history; reset moves a branch</text><text x="45" y="100" class="small">Start with A → B → C. C is the commit you want to undo.</text><text x="45" y="165" class="label">REVERT: record a correction</text><path d="M140,235 L390,235" class="line"/><path d="M390,235 L640,235" class="line"/><path d="M640,235 L890,235" class="line"/><circle cx="140" cy="235" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="132" y="243" class="label">A</text><circle cx="390" cy="235" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="382" y="243" class="label">B</text><circle cx="640" cy="235" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="632" y="243" class="label">C</text><circle cx="890" cy="235" r="27" fill="#d1fae5" stroke="#64748b" stroke-width="2"/><text x="882" y="243" class="label">R</text><text x="815" y="295" class="code">main → R</text><text x="45" y="335" class="small">R reverses the change from C. C remains in the branch history.</text><text x="45" y="395" class="label">RESET: move the local branch</text><path d="M140,455 L390,455" class="line"/><path d="M390,455 L640,455" class="line"/><circle cx="140" cy="455" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="132" y="463" class="label">A</text><circle cx="390" cy="455" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="382" y="463" class="label">B</text><circle cx="640" cy="455" r="27" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="632" y="463" class="label">C</text><text x="325" y="515" class="code">main → B</text><text x="710" y="455" class="small">C is outside main’s history now.</text><text x="45" y="565" class="small">Reset modes determine what happens to staged versions and working files.</text></svg>