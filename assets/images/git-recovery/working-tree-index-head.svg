<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Which version are you trying to undo?</title><desc id="desc">Working tree, staging area and HEAD. Add stages files and commit records them. Default restore copies index to working tree; restore --staged copies HEAD to index.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Which version are you trying to undo?</text><text x="45" y="100" class="small">The same file can have three different versions at the same time.</text><rect x="45" y="185" width="320" height="135" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="230" class="label">Working tree</text><text x="65" y="280" class="small">Files you are editing</text><rect x="440" y="185" width="320" height="135" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="460" y="230" class="label">Staging area</text><text x="460" y="280" class="small">Prepared for the next commit</text><rect x="835" y="185" width="320" height="135" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="855" y="230" class="label">HEAD commit</text><text x="855" y="280" class="small">Last recorded snapshot</text><path d="M365,220 L430,220" class="line"/><text x="365" y="165" class="code">add</text><path d="M760,220 L825,220" class="line"/><text x="755" y="165" class="code">commit</text><path d="M595,355 L200,355" class="line"/><text x="205" y="395" class="code">restore: index → working tree</text><path d="M995,445 L595,445" class="line"/><text x="585" y="485" class="code">restore --staged: HEAD → index</text><text x="45" y="555" class="small">These restore operations copy file versions; they do not move the branch.</text></svg>