<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A rejected push protects a different line of work</title><desc id="desc">A, B and C are shared. Local commit D and remote commit E diverge from C. A possible merge commit M has parents D and E.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">A rejected push protects a different line of work</text><text x="45" y="100" class="small">After fetching, you can see why the normal push was rejected.</text><path d="M120,270 L310,270" class="line"/><path d="M310,270 L510,270" class="line"/><path d="M510,270 L745,185" class="line"/><path d="M510,270 L745,355" class="line"/><path d="M745,185 L1030,270" class="line"/><path d="M745,355 L1030,270" class="line"/><circle cx="120" cy="270" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="112" y="278" class="label">A</text><circle cx="310" cy="270" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="302" y="278" class="label">B</text><circle cx="510" cy="270" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="502" y="278" class="label">C</text><circle cx="745" cy="185" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="737" y="193" class="label">D</text><circle cx="745" cy="355" r="27" fill="#d1fae5" stroke="#64748b" stroke-width="2"/><text x="737" y="363" class="label">E</text><circle cx="1030" cy="270" r="27" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="1022" y="278" class="label">M</text><text x="600" y="145" class="label">Local main before merge</text><text x="610" y="415" class="label">origin/main before merge</text><text x="920" y="210" class="label">Merged main</text><text x="45" y="475" class="small">D and E both build on C. Neither contains the other.</text><text x="45" y="520" class="small">One possible resolution: merge to create M, retaining both histories, then push.</text><text x="45" y="560" class="small">Follow the project workflow; a rebase or pull request may be required instead.</text></svg>