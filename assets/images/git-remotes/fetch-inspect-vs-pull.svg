<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Fetch separately, or pull with a clear policy</title><desc id="desc">Separate fetch, inspect and fast-forward steps compared with pull --ff-only, which fetches then attempts a fast-forward.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Fetch separately, or pull with a clear policy</text><text x="45" y="100" class="small">Both paths fetch first. The difference is when you choose to integrate.</text><rect x="45" y="140" width="1110" height="160" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="70" y="177" class="label">Separate commands: a deliberate inspection point</text><text x="70" y="232" class="label">Fetch</text><text x="425" y="232" class="label">Inspect</text><text x="835" y="232" class="label">Fast-forward</text><path d="M205,225 L400,225" class="line"/><path d="M570,225 L810,225" class="line"/><text x="70" y="270" class="code">git fetch origin</text><text x="425" y="270" class="code">git log / git diff</text><text x="835" y="270" class="code">git merge --ff-only</text><rect x="45" y="335" width="1110" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="70" y="372" class="label">One command: git pull --ff-only</text><text x="70" y="430" class="label">Fetch</text><path d="M205,423 L400,423" class="line"/><text x="425" y="430" class="label">Attempt fast-forward</text><text x="70" y="465" class="small">If histories diverge, stop. The fetched remote-tracking reference may still update.</text><text x="45" y="550" class="small">Examples assume the current branch tracks the intended remote branch.</text></svg>