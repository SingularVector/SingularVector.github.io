<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Fetch: learn what changed, then decide</title><desc id="desc">One linear history A through E. Local main remains at C; origin/main points to E after fetching.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Fetch: learn what changed, then decide</text><text x="45" y="100" class="small">After git fetch origin: new commits are local, but main has not moved.</text><path d="M130,255 L330,255" class="line"/><path d="M330,255 L530,255" class="line"/><path d="M530,255 L730,255" class="line"/><path d="M730,255 L930,255" class="line"/><circle cx="130" cy="255" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="122" y="263" class="label">A</text><circle cx="330" cy="255" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="322" y="263" class="label">B</text><circle cx="530" cy="255" r="27" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="522" y="263" class="label">C</text><circle cx="730" cy="255" r="27" fill="#d1fae5" stroke="#64748b" stroke-width="2"/><text x="722" y="263" class="label">D</text><circle cx="930" cy="255" r="27" fill="#d1fae5" stroke="#64748b" stroke-width="2"/><text x="922" y="263" class="label">E</text><text x="465" y="180" class="code">main → C</text><text x="815" y="345" class="code">origin/main → E</text><text x="45" y="430" class="small">C → D → E is one continuous history. There is no divergence here.</text><text x="45" y="475" class="small">Your working files still match the local branch at C.</text><text x="45" y="520" class="small">A later fast-forward can move main from C to E, after you review the changes.</text></svg>