<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Give the branch a destination and an upstream</title><desc id="desc">Push -u publishes local feature/logging to the branch of the same name on origin and records origin/feature/logging as its upstream.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Give the branch a destination and an upstream</text><text x="45" y="105" class="small">Starting point: feature/logging exists locally, with no upstream configured.</text><rect x="45" y="140" width="1110" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="70" y="180" class="label">Publish and configure the relationship</text><text x="70" y="215" class="code">git push -u origin feature/logging</text><rect x="45" y="285" width="510" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="645" y="285" width="510" height="180" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="70" y="325" class="label">Local branch</text><text x="70" y="370" class="code">feature/logging</text><text x="70" y="420" class="small">Upstream: origin/feature/logging</text><text x="670" y="325" class="label">Branch on origin</text><text x="670" y="370" class="code">feature/logging</text><text x="670" y="420" class="small">Receives the committed work.</text><path d="M560,370 L635,370" class="line"/><text x="45" y="520" class="small">A successful push publishes the commits; -u records the upstream relationship.</text><text x="45" y="560" class="small">The remote-tracking reference origin/feature/logging is stored locally.</text></svg>