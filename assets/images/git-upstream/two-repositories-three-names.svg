<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Two repositories, three names</title><desc id="desc">Local main and remote-tracking origin/main live locally. Remote main lives on the server. Fetch transfers information from the server to origin/main.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Two repositories, three names</text><rect x="45" y="140" width="640" height="325" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="835" y="140" width="320" height="325" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="70" y="185" class="label">Your local repository</text><text x="860" y="185" class="label">Remote repository</text><text x="70" y="250" class="code">main</text><text x="70" y="285" class="small">Your branch: moves when you commit or integrate.</text><text x="70" y="355" class="code">origin/main</text><text x="70" y="390" class="small">Local record of the remote branch’s position.</text><text x="860" y="280" class="code">main</text><text x="860" y="320" class="small">The server’s branch.</text><path d="M830,355 L690,355" class="line"/><text x="715" y="325" class="code">fetch</text><text x="45" y="515" class="small">origin = the configured name and address used to contact the remote.</text><text x="45" y="555" class="small">Fetching refreshes origin/main. It does not move your local main.</text></svg>