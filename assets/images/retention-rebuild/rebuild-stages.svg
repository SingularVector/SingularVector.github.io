<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Rebuild the behaviour before centralising management</title><desc id="desc">Four stages: define policies, inspect and report, add controlled execution, and centralise policies with run history.</desc><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}</style><text x="45" y="55" class="title">Rebuild the behaviour before centralising management</text><text x="45" y="100" class="small">Each stage builds on behaviour that we can explain and check.</text><rect x="45" y="145" width="530" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="190" class="label">1. Define the policy</text><text x="65" y="245" class="small">Age, scope, exclusions and failure meanings</text><rect x="625" y="145" width="530" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="645" y="190" class="label">2. Inspect and report</text><text x="645" y="245" class="small">Select candidates without deleting files</text><rect x="45" y="350" width="530" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="395" class="label">3. Add controlled execution</text><text x="65" y="450" class="small">Recheck targets and confirm real outcomes</text><rect x="625" y="350" width="530" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="645" y="395" class="label">4. Centralise policy and history</text><text x="645" y="450" class="small">Ownership, revisions, workers and run results</text><text x="45" y="560" class="small">CSV migration connects existing policies to the new engine before execution is introduced.</text></svg>