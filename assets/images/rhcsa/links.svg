<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Two names for one file, plus a symbolic link</title><desc id="desc">notes.txt and notes-hard.txt are directory entries for the same inode. A separate symbolic link notes-soft.txt stores notes.txt as its target pathname.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}.code{font-family:monospace;font-size:22px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style>
<text x="45" y="55" class="title">Two names for one file, plus a symbolic link</text>
<text x="45" y="100" class="small">Hard links reach the inode. A symbolic link resolves a pathname.</text>
<rect x="45" y="150" width="335" height="100" rx="12" fill="#f0fdf4" stroke="#cbd5e1"/>
<text x="65" y="188" class="label">notes-soft.txt</text>
<text x="65" y="222" class="small">Own inode; stores notes.txt</text>
<rect x="45" y="330" width="335" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="65" y="368" class="label">notes.txt</text>
<text x="65" y="402" class="small">Directory entry</text>
<rect x="45" y="465" width="335" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="65" y="503" class="label">notes-hard.txt</text>
<text x="65" y="537" class="small">Directory entry</text>
<rect x="535" y="360" width="250" height="100" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="555" y="398" class="label">Shared inode</text>
<text x="555" y="432" class="small">Metadata; link count 2</text>
<rect x="895" y="360" width="260" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="915" y="398" class="label">File data</text>
<text x="915" y="432" class="small">One shared content</text>
<path d="M210 250 L210 325" class="line"/>
<text x="230" y="295" class="small">Resolve target path</text>
<path d="M380 380 L455 380 L455 395 L530 395" class="line"/>
<path d="M380 515 L455 515 L455 430 L530 430" class="line"/>
<path d="M785 410 L890 410" class="line"/>
<text x="45" y="600" class="small">Remove notes.txt: the other hard link survives, while the symbolic link becomes dangling.</text>
</svg>