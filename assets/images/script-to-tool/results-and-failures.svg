<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">An empty result is not a failed scan</title><desc id="desc">Successful scans return JSON and exit zero, including an empty array. Caught filesystem errors explain failure on stderr and exit one.</desc><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}</style><text x="45" y="55" class="title">An empty result is not a failed scan</text><text x="45" y="105" class="small">For the example scanner, stdout is JSON on success; stderr explains caught scan errors.</text><rect x="45" y="145" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="177" class="label">Completed, with matches</text><text x="65" y="220" class="code">stdout: [{&quot;path&quot;: &quot;...&quot;, &quot;bytes&quot;: 2048}]</text><text x="720" y="220" class="small">Exit 0: matching records returned.</text><rect x="45" y="275" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="307" class="label">Completed, no matches</text><text x="65" y="350" class="code">stdout: []</text><text x="720" y="350" class="small">Exit 0: nothing qualified.</text><rect x="45" y="405" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="437" class="label">Caught filesystem failure</text><text x="65" y="480" class="code">stderr: Scan failed: ...</text><text x="720" y="480" class="small">Exit 1: no success JSON emitted.</text><text x="45" y="565" class="small">If you choose to return partial results, make their limitations explicit in the interface.</text></svg>