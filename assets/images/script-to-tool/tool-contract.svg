<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">From a useful script to dependable behaviour</title><desc id="desc">Four decisions: explicit inputs, usable results, defined failure behaviour and focused verification.</desc><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}</style><text x="45" y="55" class="title">From a useful script to dependable behaviour</text><text x="45" y="105" class="small">Start with a useful script. Make its assumptions visible before others depend on it.</text><rect x="45" y="150" width="530" height="160" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="190" class="label">Inputs</text><text x="65" y="235" class="small">Named path and threshold</text><text x="65" y="270" class="small">Validate before starting work.</text><rect x="625" y="150" width="530" height="160" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="645" y="190" class="label">Results</text><text x="645" y="235" class="small">Records callers can consume</text><text x="645" y="270" class="small">Keep diagnostics separate.</text><rect x="45" y="350" width="530" height="160" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="390" class="label">Failure behaviour</text><text x="65" y="435" class="small">Empty, failed or partial?</text><text x="65" y="470" class="small">Report the outcome explicitly.</text><rect x="625" y="350" width="530" height="160" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="645" y="390" class="label">Verification</text><text x="645" y="435" class="small">Check boundaries and failures</text><text x="645" y="470" class="small">Document the behaviour you tested.</text><text x="45" y="565" class="small">The goal: a clear way in, a usable result, and an understandable failure.</text></svg>