<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Specific settings first, defaults afterwards</title><desc id="desc">For lab-db, User dbadmin in the first block wins over User adminuser in lab-*. Keepalive and forwarding defaults still apply.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">Specific settings first, defaults afterwards</text><text x="45" y="100" class="small">For most options, the first obtained value wins. Matching blocks fill in unset values.</text><rect x="45" y="140" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="172" class="label">1. Specific host</text><text x="65" y="212" class="code">Host lab-db → User dbadmin</text><text x="650" y="212" class="small">User is now dbadmin.</text><rect x="45" y="275" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="307" class="label">2. Host group</text><text x="65" y="347" class="code">Host lab-* → User adminuser</text><text x="650" y="347" class="small">User stays dbadmin; keepalives are added.</text><rect x="45" y="410" width="1110" height="110" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="442" class="label">3. General defaults</text><text x="65" y="482" class="code">Host * → ForwardAgent no</text><text x="650" y="482" class="small">Agent forwarding is disabled.</text><text x="45" y="570" class="small">Some directives accumulate values instead, including IdentityFile. Inspect with ssh -G.</text></svg>