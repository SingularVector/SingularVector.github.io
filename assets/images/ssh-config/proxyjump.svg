<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">One command, two SSH authentications</title><desc id="desc">The workstation authenticates to the bastion and establishes an SSH connection to the internal application server through TCP forwarding. No private key is copied to the bastion.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.code{font-family:monospace;font-size:20px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><text x="45" y="55" class="title">One command, two SSH authentications</text><text x="45" y="100" class="small">ssh prod-app: the local client handles the route and destination authentication.</text><rect x="45" y="180" width="320" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="225" class="label">Your workstation</text><text x="60" y="280" class="small">Both private identities stay local.</text><rect x="440" y="180" width="320" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="455" y="225" class="label">Bastion</text><text x="455" y="280" class="small">Forwards TCP to the target.</text><rect x="835" y="180" width="320" height="150" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="850" y="225" class="label">Application server</text><text x="850" y="280" class="small">Internal address: 10.20.30.40</text><path d="M370,250 L430,250" class="line"/><path d="M765,250 L825,250" class="line"/><text x="45" y="395" class="small">Bastion login: gatewayuser with the gateway identity.</text><text x="45" y="440" class="small">Destination login: appadmin with the production identity, through the bastion.</text><text x="45" y="485" class="small">SSH encryption and host-key verification extend from your client to the target.</text><text x="45" y="550" class="small">Requires bastion forwarding permission and a network route from bastion to target.</text></svg>